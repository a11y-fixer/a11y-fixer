name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: pnpm/action-setup@v4 reads the pnpm version from the
      # root package.json "packageManager" field, keeping CI and local in sync
      # (the lockfile's pnpmfileChecksum is pnpm-10-specific, so pinning v9 here
      # broke `--frozen-lockfile`).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      # Coverage thresholds (90%) live in each package's vitest.config.ts, so
      # this step fails the build on any regression below the gate.
      - run: pnpm -r run coverage
