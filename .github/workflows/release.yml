name: Release

# Publishes the free packages (@a11y-fixer/core, @a11y-fixer/cli) to npm when a
# GitHub Release is published. The paid packages (@a11y-fixer/ai,
# @a11y-fixer/github-action) are marked "private" and are skipped by `pnpm -r publish`.
#
# Auth is tokenless via npm Trusted Publishing (OIDC) — there is no NPM_TOKEN.
# Prerequisites (one-time, on npmjs.com):
#   - For BOTH @a11y-fixer/core and @a11y-fixer/cli: package Settings →
#     Trusted Publisher → GitHub Actions, with
#       Organization/user: a11y-fixer
#       Repository:        a11y-fixer
#       Workflow filename: release.yml
#   - The package versions in packages/*/package.json match the release tag.
# pnpm >= 10.17 performs the OIDC token exchange automatically in CI.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1 and Node >= 22.14.
      # pnpm delegates the publish to the npm CLI on PATH, so ensure a recent npm.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      # Publish each package in its own step (core before cli, so cli's
      # workspace:* dep resolves to a published version). Each package needs its
      # own OIDC token exchange with the Trusted Publisher — `pnpm -r publish`
      # only authenticates the first package, so we invoke per-package instead.
      # pnpm rewrites `workspace:*` to the real version at publish time; no token
      # is used (OIDC via the configured Trusted Publisher).
      #
      # Each step is idempotent: it skips a version that is already on npm, so a
      # re-run after a partial publish only ships what's missing.
      - name: Publish @a11y-fixer/core
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@a11y-fixer/core@$V" version >/dev/null 2>&1; then
            echo "@a11y-fixer/core@$V already published — skipping."
          else
            pnpm --filter @a11y-fixer/core publish --access public --no-git-checks --provenance
          fi
      - name: Publish @a11y-fixer/cli
        run: |
          V=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@a11y-fixer/cli@$V" version >/dev/null 2>&1; then
            echo "@a11y-fixer/cli@$V already published — skipping."
          else
            pnpm --filter @a11y-fixer/cli publish --access public --no-git-checks --provenance
          fi
