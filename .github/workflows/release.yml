name: Release

# Publishes the free packages (@a11y-fixer/core, @a11y-fixer/cli) to npm when a
# GitHub Release is published. The paid packages (@a11y-fixer/ai,
# @a11y-fixer/github-action) are marked "private" and are skipped by `pnpm -r publish`.
#
# Auth is tokenless via npm Trusted Publishing (OIDC) — there is no NPM_TOKEN.
# Prerequisites (one-time, on npmjs.com):
#   - For BOTH @a11y-fixer/core and @a11y-fixer/cli: package Settings →
#     Trusted Publisher → GitHub Actions, with
#       Organization/user: a11y-fixer
#       Repository:        a11y-fixer
#       Workflow filename: release.yml
#   - The package versions in packages/*/package.json match the release tag.
# pnpm >= 10.17 performs the OIDC token exchange automatically in CI.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1 and Node >= 22.14.
      # pnpm delegates the publish to the npm CLI on PATH, so ensure a recent npm.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      # Publish every non-private workspace package in topological order
      # (core before cli), converting `workspace:*` deps to real versions.
      # --access public is required the first time each scoped package is created.
      # No token: pnpm exchanges the GitHub OIDC id-token for a short-lived npm
      # credential via the configured Trusted Publisher.
      - run: pnpm -r publish --access public --no-git-checks --provenance
